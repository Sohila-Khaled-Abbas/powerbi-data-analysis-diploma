<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc"><title id="title">Power Query learning pipeline</title><desc id="desc">Source inputs flow through profiling, transformation, validation, semantic model, and reporting.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#1E1B4B"/></linearGradient><linearGradient id="stroke"><stop stop-color="#34D399"/><stop offset="1" stop-color="#60A5FA"/></linearGradient></defs><rect width="1440" height="620" rx="32" fill="url(#bg)"/><text x="72" y="90" fill="#F8FAFC" font-family="Inter,Arial" font-size="34" font-weight="700">FROM SOURCE TO TRUSTED OUTPUT</text><text x="74" y="126" fill="#94A3B8" font-family="Inter,Arial" font-size="18">Use the same validation mindset for Excel, flat files, PDFs, APIs, and databases.</text><g font-family="Inter,Arial"><g fill="#111F35" stroke="url(#stroke)" stroke-width="2"><rect x="65" y="230" width="205" height="170" rx="22"/><rect x="315" y="230" width="205" height="170" rx="22"/><rect x="565" y="230" width="205" height="170" rx="22"/><rect x="815" y="230" width="205" height="170" rx="22"/><rect x="1065" y="230" width="300" height="170" rx="22"/></g><g fill="#67E8F9" font-size="19" font-weight="700"><text x="168" y="275" text-anchor="middle">01 · SOURCE</text><text x="418" y="275" text-anchor="middle">02 · PROFILE</text><text x="668" y="275" text-anchor="middle">03 · TRANSFORM</text><text x="918" y="275" text-anchor="middle">04 · VALIDATE</text><text x="1215" y="275" text-anchor="middle">05 · CONSUME</text></g><g fill="#E2E8F0" font-size="16" text-anchor="middle"><text x="168" y="315">Excel · CSV · PDF</text><text x="168" y="341">JSON · API · SQL</text><text x="418" y="315">Schema · grain</text><text x="418" y="341">keys · nulls · types</text><text x="668" y="315">M steps · reshape</text><text x="668" y="341">append · merge</text><text x="918" y="315">Rows · keys · totals</text><text x="918" y="341">errors · refresh</text><text x="1215" y="315">Semantic model</text><text x="1215" y="341">Power BI reports</text></g></g><g stroke="#E2E8F0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M270 315h40m-10-10 10 10-10 10M520 315h40m-10-10 10 10-10 10M770 315h40m-10-10 10 10-10 10M1020 315h40m-10-10 10 10-10 10"/></g><path d="M918 420v65H418v-65m-10 10 10-10 10 10" fill="none" stroke="#FBBF24" stroke-width="3" stroke-dasharray="9 8" stroke-linecap="round" stroke-linejoin="round"/><text x="668" y="525" fill="#FCD34D" text-anchor="middle" font-family="Inter,Arial" font-size="17" font-weight="600">If validation fails: return to profiling or transformation — do not hide the mismatch.</text></svg>