<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 540" role="img" aria-labelledby="title desc"><title id="title">Repeatable learning loop</title><desc id="desc">Six learning steps: preview, watch, rebuild, experiment, explain, validate and review, connected as a continuous loop.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#172554"/></linearGradient><linearGradient id="accent"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient></defs><rect width="1400" height="540" rx="32" fill="url(#bg)"/><text x="70" y="85" fill="#F8FAFC" font-family="Inter,Arial" font-size="34" font-weight="700">THE LEARNING LOOP</text><text x="72" y="122" fill="#94A3B8" font-family="Inter,Arial" font-size="18">A lesson becomes a skill when you can reproduce, test, and explain it.</text><g font-family="Inter,Arial" text-anchor="middle"><g fill="#111F35" stroke="url(#accent)" stroke-width="2"><rect x="65" y="210" width="180" height="130" rx="22"/><rect x="285" y="210" width="180" height="130" rx="22"/><rect x="505" y="210" width="180" height="130" rx="22"/><rect x="725" y="210" width="180" height="130" rx="22"/><rect x="945" y="210" width="180" height="130" rx="22"/><rect x="1165" y="210" width="180" height="130" rx="22"/></g><g fill="#67E8F9" font-size="17" font-weight="700"><text x="155" y="250">01 · PREVIEW</text><text x="375" y="250">02 · WATCH</text><text x="595" y="250">03 · REBUILD</text><text x="815" y="250">04 · EXPERIMENT</text><text x="1035" y="250">05 · EXPLAIN</text><text x="1255" y="250">06 · VALIDATE</text></g><g fill="#E2E8F0" font-size="15"><text x="155" y="286">Ask a question</text><text x="155" y="309">before the lesson</text><text x="375" y="286">Capture the</text><text x="375" y="309">data problem</text><text x="595" y="286">Reproduce the</text><text x="595" y="309">demonstration</text><text x="815" y="286">Change input</text><text x="815" y="309">and test edges</text><text x="1035" y="286">Write the why</text><text x="1035" y="309">in your own words</text><text x="1255" y="286">Check rows, keys,</text><text x="1255" y="309">types and totals</text></g></g><path d="M245 275h35m-10-10 10 10-10 10M465 275h35m-10-10 10 10-10 10M685 275h35m-10-10 10 10-10 10M905 275h35m-10-10 10 10-10 10M1125 275h35m-10-10 10 10-10 10" fill="none" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M1255 365v65H155v-65m-10 10 10-10 10 10" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="475" text-anchor="middle" fill="#A5B4FC" font-family="Inter,Arial" font-size="18" font-weight="600">07 · REVIEW AFTER 2–7 DAYS → REPEAT WITHOUT NOTES</text></svg>